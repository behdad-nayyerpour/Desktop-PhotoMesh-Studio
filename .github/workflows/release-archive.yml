name: Maintain release archive
on:
  push:
    branches: [main]
    paths: [".github/workflows/release-archive.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: maintain-release-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Remove superseded 1.0.2 downloads and shorten its notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v1.0.3
          test "$(gh api repos/$GH_REPO/releases/tags/v1.0.3 --jq '.assets | map(select(.state == "uploaded" and (.name == "PhotoMeshStudio_Setup_1.0.3.exe" or .name == "PhotoMeshStudio_Setup_1.0.3.exe.sha256"))) | length')" = 2
          test "$(gh api repos/$GH_REPO/releases/431939088 --jq .tag_name)" = v1.0.2
          for name in PhotoMeshStudio_Setup_1.0.2.exe PhotoMeshStudio_Setup_1.0.2.exe.sha256; do
            asset_id=$(gh api repos/$GH_REPO/releases/431939088/assets --jq ".[] | select(.name == \"$name\") | .id")
            if [ -n "$asset_id" ]; then
              gh api --method DELETE repos/$GH_REPO/releases/assets/$asset_id
            fi
          done
          gh api --method PATCH repos/$GH_REPO/releases/431939088 -f body="Offline engine compatibility, optional neural matching, GPS framing and stability improvements." --jq '{tag_name, body}'
          test "$(gh api repos/$GH_REPO/releases/431939088/assets --jq length)" = 0
          test "$(gh api repos/$GH_REPO/releases/latest --jq .tag_name)" = v1.0.3
