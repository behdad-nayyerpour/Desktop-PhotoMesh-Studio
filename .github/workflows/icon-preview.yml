name: PhotoMesh 1.0.3 validation and installer
on:
  push:
    branches: ["codex/independent-layer-icons"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-preview-installer
  cancel-in-progress: true
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Qt and Open3D system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgomp1
      - name: Install test dependencies
        run: pip install -q -r requirements-dev.txt psutil ruff pytest-timeout
      - name: Compile and check undefined names
        run: |
          python -m compileall -q photomesh main.py tests tools
          ruff check --select F821,F822,F823 photomesh
      - name: Compare equivalent photo-processing batches
        run: python tools/compare_pool_batches.py
      - name: Fetch comparison baseline
        run: git fetch --depth=1 origin 05466142f5ca625c3069aa703903b42b6d842341
      - name: Compare equivalent texture workloads
        env:
          PHOTOMESH_BASELINE: 05466142f5ca625c3069aa703903b42b6d842341
        run: python tools/benchmark_workflow_101.py
      - name: Repository review inventory
        run: python tools/review_inventory.py
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoMeshStudio-1.0.3-Audit
          path: review/
      - name: Full regression suite
        run: python -m pytest -vv -rs --maxfail=10 --timeout=180 -o faulthandler_timeout=120 -p no:cacheprovider tests
  preview:
    runs-on: windows-latest
    needs: linux
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QPA_FONTDIR: 'C:\Windows\Fonts'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install test dependencies
        run: pip install -q -r requirements-dev.txt psutil pytest-timeout
      - name: Compile and test
        run: |
          python -m compileall -q photomesh main.py tests tools
          python -m pytest -vv -rs --maxfail=10 --timeout=180 -o faulthandler_timeout=120 -p no:cacheprovider tests
      - name: Render actual menus and toolbar previews
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, os.getcwd())
          from PySide6.QtCore import Qt, QCoreApplication
          QCoreApplication.setAttribute(Qt.AA_ShareOpenGLContexts)
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          from PySide6.QtGui import QFont, QFontDatabase, QRawFont
          assert QFontDatabase.addApplicationFont(os.path.join(os.environ["WINDIR"], "Fonts", "segoeui.ttf")) >= 0
          app.setFont(QFont("Segoe UI", 9))
          assert QRawFont.fromFont(app.font()).supportsCharacter(ord("T"))
          from photomesh.theme import apply_theme
          from photomesh.mainwindow import MainWindow
          app.setOrganizationName("PhotoMeshIconReview")
          app.setApplicationName("PhotoMeshIconReview")
          apply_theme(app, "Dark")
          w = MainWindow(); w.resize(1600, 900); w.show()
          os.makedirs("preview", exist_ok=True)
          for theme in ("Dark", "Light"):
              apply_theme(app, theme)
              for _ in range(10): app.processEvents()
              assert w.grab().copy(0, 0, 1600, 230).save("preview/toolbar-" + theme.lower() + ".png")
              for checked in (False, True):
                  for button in w.mode_buttons: button.visibility.setChecked(checked)
                  for _ in range(10): app.processEvents()
                  capture = "preview/layers-" + theme.lower() + ("-on" if checked else "-off") + ".png"
                  assert w.display_toolbar.grab().save(capture)
                  import base64
                  print("CAPTURE_IMAGE " + capture + " " + base64.b64encode(open(capture, "rb").read()).decode("ascii"), flush=True)
              from PySide6.QtGui import QImage, QPainter, QColor, QFont
              sheet = QImage(2000, 1200, QImage.Format_ARGB32_Premultiplied)
              sheet.fill(QColor("#202834" if theme == "Dark" else "#E8EDF3"))
              painter = QPainter(sheet)
              painter.setFont(QFont("Segoe UI", 12))
              for index, (name, menu) in enumerate(w.menus.items()):
                  menu.ensurePolished(); menu.adjustSize()
                  image = menu.grab().toImage()
                  x = 20 + (index % 4) * 495
                  y = 20 + (index // 4) * 590
                  painter.setPen(QColor("#E8F0FA" if theme == "Dark" else "#213449"))
                  painter.drawText(x, y + 20, name)
                  painter.drawImage(x, y + 36, image)
              painter.end()
              assert sheet.save("preview/menus-" + theme.lower() + ".png")
              print("MENU_" + theme.upper() + "_CAPTURE_OK", flush=True)

          os._exit(0)
      - name: Fetch verified released runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.2 --repo behdad-nayyerpour/Desktop-PhotoMesh-Studio --pattern "PhotoMeshStudio_Setup_1.0.2.exe*" --dir released
          $setupPath = Join-Path $PWD "released/PhotoMeshStudio_Setup_1.0.2.exe"
          $expected = ((Get-Content "$setupPath.sha256" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash $setupPath -Algorithm SHA256).Hash -ne $expected) { throw "Released runtime checksum mismatch" }
          $runtimePath = Join-Path $env:RUNNER_TEMP "PhotoMeshIconRuntime"
          $installArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$runtimePath`"", '/TASKS=""')
          $process = Start-Process -FilePath $setupPath -ArgumentList $installArgs -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Runtime installation failed: $($process.ExitCode)" }
          "ICON_RUNTIME=$runtimePath" >> $env:GITHUB_ENV
      - name: Native CPU reconstruction and numerical acceptance
        timeout-minutes: 15
        shell: pwsh
        run: |
          & (Join-Path $env:ICON_RUNTIME "python/python.exe") "tools/benchmark_engine_102.py" --exe (Join-Path $env:ICON_RUNTIME "tools/colmap-cpu/bin/colmap.exe") --output "preview/native-engine-103.json"
          if ($LASTEXITCODE -ne 0) { throw "Native CPU numerical acceptance failed" }
      - name: Validate production packaging script syntax
        shell: pwsh
        run: |
          $releaseTokens = $null
          $releaseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD "packaging/build_release.ps1"), [ref]$releaseTokens, [ref]$releaseErrors) | Out-Null
          if ($releaseErrors.Count) { throw ($releaseErrors | Out-String) }
      - name: Build 1.0.3 installer with the verified runtime
        shell: pwsh
        run: |
          $stagePath = Join-Path $env:RUNNER_TEMP "PhotoMeshIconStage"
          $appPath = Join-Path $stagePath "app"
          New-Item -ItemType Directory -Force $stagePath, $appPath, "preview" | Out-Null
          foreach ($part in @("python", "tools")) {
            Copy-Item -LiteralPath (Join-Path $env:ICON_RUNTIME $part) -Destination (Join-Path $stagePath $part) -Recurse
          }
          foreach ($part in @("photomesh", "docs", "packaging", "main.py", "README.md", "CHANGES.md", "UPDATING.md", "requirements.txt", "run.bat", "setup.bat", "screenshot.png", "screenshot-light.png")) {
            Copy-Item -LiteralPath (Join-Path $PWD $part) -Destination (Join-Path $appPath $part) -Recurse
          }
          $runtimeId = Join-Path $env:ICON_RUNTIME "app/runtime.id"
          if (Test-Path -LiteralPath $runtimeId) { Copy-Item -LiteralPath $runtimeId -Destination (Join-Path $appPath "runtime.id") }
          $env:PHOTOMESH_STAGE_APP = $appPath
          & (Join-Path $stagePath "python/python.exe") -c "import os, sys; sys.path.insert(0, os.environ['PHOTOMESH_STAGE_APP']); import photomesh, PySide6, psutil, pyproj; from pathlib import Path; assert Path(photomesh.__file__).resolve().is_relative_to(Path(os.environ['PHOTOMESH_STAGE_APP']).resolve()); assert photomesh.APP_VERSION == '1.0.3'; from photomesh.memguard import require_available_bytes; print('Staged runtime OK:', photomesh.APP_VERSION, require_available_bytes())"
          if ($LASTEXITCODE -ne 0) { throw "Bundled runtime import failed" }
          $isccPath = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $isccPath)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
          }
          & $isccPath /Qp "/DAppVersion=1.0.3" "/DStageDir=$stagePath" "/DOutputDir=$PWD/preview" "packaging/release.iss"
          if ($LASTEXITCODE -ne 0) { throw "Preview installer compilation failed" }
          $digest = (Get-FileHash "preview/PhotoMeshStudio_Setup_1.0.3.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  PhotoMeshStudio_Setup_1.0.3.exe" | Set-Content "preview/PhotoMeshStudio_Setup_1.0.3.exe.sha256"
          @("PhotoMesh Studio 1.0.3 release candidate; no GitHub Release is published.", "Commit: ${{ github.sha }}", "Runtime: verified v1.0.2 installer.", "Close PhotoMesh Studio before running this test installer.", "Application version 1.0.3. New saves use schema 2; keep a separate project copy for older application versions.") | Set-Content "preview/TEST-BUILD.txt"
      - name: Upgrade the disposable 1.0.2 installation and verify installed 1.0.3
        shell: pwsh
        run: |
          $upgradeRoot = [IO.Path]::GetFullPath($env:ICON_RUNTIME)
          $temporaryRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\') + '\'
          if (-not $upgradeRoot.StartsWith($temporaryRoot, [StringComparison]::OrdinalIgnoreCase)) { throw "Upgrade fixture must stay within runner temporary files" }
          $obsoleteProbe = Join-Path $upgradeRoot "app/photomesh/obsolete_release_probe.py"
          "obsolete release fixture" | Set-Content -LiteralPath $obsoleteProbe
          $userFixture = Join-Path $env:RUNNER_TEMP "PhotoMesh103UserData"
          New-Item -ItemType Directory -Force $userFixture | Out-Null
          $retainedFile = Join-Path $userFixture "project.pmsx"
          "external user metadata fixture" | Set-Content -LiteralPath $retainedFile
          $beforeHash = (Get-FileHash -LiteralPath $retainedFile -Algorithm SHA256).Hash
          $setup103 = Join-Path $PWD "preview/PhotoMeshStudio_Setup_1.0.3.exe"
          $upgradeArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=`"$upgradeRoot`"", '/TASKS=""')
          $upgradeProcess = Start-Process -FilePath $setup103 -ArgumentList $upgradeArgs -Wait -PassThru -WindowStyle Hidden
          if ($upgradeProcess.ExitCode -ne 0) { throw "1.0.3 upgrade installation failed" }
          if (Test-Path -LiteralPath $obsoleteProbe) { throw "Obsolete application file survived upgrade" }
          if ((Get-FileHash -LiteralPath $retainedFile -Algorithm SHA256).Hash -ne $beforeHash) { throw "External project metadata changed during upgrade" }
          & (Join-Path $upgradeRoot "python/python.exe") "tools/validate_installed_103.py" (Join-Path $upgradeRoot "app") (Join-Path $PWD "preview")
          if ($LASTEXITCODE -ne 0) { throw "Installed application acceptance failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PhotoMeshStudio-1.0.3-Candidate
          path: preview/
          retention-days: 14
          if-no-files-found: ignore
