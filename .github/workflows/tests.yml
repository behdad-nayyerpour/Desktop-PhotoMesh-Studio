# Non-GPU test suite. Lean on purpose (private repo: Actions minutes are limited,
# Windows minutes count double):
# - main and version-tag pushes run Linux tests;
# - release/1.0.0 validation runs Linux and Windows;
# - main + tag pushed together (a release) share one run (same commit);
# - Windows can also be started by hand (Actions > Tests > Run workflow > windows).
# COLMAP / GPU / local-data / OpenGL tests are marked and reported as skipped
# (tests/conftest.py: CI_ONLY_LOCAL). The tests themselves run offline (no-network guard).
name: Tests

on:
  push:
    branches: [main, "release/1.0.0", "improve/workflow-review", "improve/engine-modernization", "codex/fix-errors-toolbar", "codex/compact-toolbar"]
    tags: ["v*"]
    paths-ignore: ["**.md", "screenshot*.png", "*.bat"]
  workflow_dispatch:
    inputs:
      windows:
        description: "Also run on Windows (counts 2x minutes)"
        type: boolean
        default: false
      native_engine:
        description: "Also run the pinned Windows native-engine geometry benchmark"
        type: boolean
        default: false

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Compile Python sources
        run: python -m compileall -q photomesh main.py tests tools
      - name: System libraries (Qt offscreen, Open3D)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgomp1 xvfb xauth libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-randr0
      - name: Install
        run: pip install -q -r requirements-dev.txt psutil ruff
      - name: Undefined names and invalid exports
        run: ruff check --select F821,F822,F823 photomesh
      - name: Workflow 1.0.1 regressions
        run: python -m pytest -vv --tb=short -p no:cacheprovider tests/test_workflow_101.py
      - name: Reference and Ortho regressions
        timeout-minutes: 3
        run: python -m pytest -x -vv --tb=short -o faulthandler_timeout=60 -p no:cacheprovider tests/test_reference_lifecycle.py tests/test_release_0117.py tests/test_release_100.py tests/test_release_100_followup.py
      - name: Tests (no COLMAP / GPU)
        run: |
          set -o pipefail
          python -m pytest -vv -rs -o faulthandler_timeout=120 -p no:cacheprovider tests 2>&1 | tee pytest.txt
      - name: OpenGL overlay smoke test (Mesa)
        env:
          QT_QPA_PLATFORM: xcb
          PHOTOMESH_GL_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python -m pytest -s -vv -rs --tb=short -m opengl tests/test_view_overlay.py
      - name: Toolbar visual check
        run: |
          python - <<'PY'
          import base64, os
          from PySide6.QtCore import Qt, QCoreApplication, QBuffer, QIODevice
          QCoreApplication.setAttribute(Qt.AA_ShareOpenGLContexts)
          from PySide6.QtWidgets import QApplication
          app = QApplication([])
          app.setOrganizationName("PhotoMeshToolbarReview")
          app.setApplicationName("PhotoMeshToolbarReview")
          from photomesh.mainwindow import MainWindow
          from photomesh.theme import apply_dark_theme
          apply_dark_theme(app)
          w = MainWindow(); w.resize(1280, 800); w.show()
          for _ in range(10): app.processEvents()
          image = w.grab().copy(0, 0, 1280, 260)
          buffer = QBuffer(); buffer.open(QIODevice.WriteOnly); image.save(buffer, "PNG")
          print("TOOLBAR_IMAGE=" + base64.b64encode(bytes(buffer.data())).decode(), flush=True)
          os._exit(0)
          PY
      - name: Compare processing performance with 1.0.0
        run: python tools/benchmark_workflow_101.py
      - name: Summary
        if: always()
        run: |
          { echo '### Tests (Linux)'; echo '```'; if [ -f pytest.txt ]; then grep -E '^(SKIPPED|FAILED|ERROR)|passed|failed' pytest.txt || true; fi; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  windows:
    if: (github.event_name == 'workflow_dispatch' && (inputs.windows || inputs.native_engine)) || (github.ref == 'refs/heads/codex/compact-toolbar' || github.ref == 'refs/heads/codex/fix-errors-toolbar' || github.ref == 'refs/heads/release/1.0.0' || github.ref == 'refs/heads/improve/workflow-review' || github.ref == 'refs/heads/improve/engine-modernization')
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -q -r requirements-dev.txt psutil
      - name: Tests (no COLMAP / GPU)
        run: python -m pytest -q -rs -p no:cacheprovider tests

      - name: Parse packaging PowerShell
        shell: pwsh
        run: |
          $parseTokens = $null
          $parseProblems = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'packaging/build_release.ps1'), [ref]$parseTokens, [ref]$parseProblems)
          if ($parseProblems.Count) { throw ($parseProblems | Out-String) }
      - name: Prepare pinned CPU engine and offline models
        if: github.ref == 'refs/heads/improve/engine-modernization' || (github.event_name == 'workflow_dispatch' && inputs.native_engine)
        run: python tools/prepare_engine.py --output engine-fixture --cache engine-downloads --cpu-only
      - name: Native 4.2.1 geometry and feature integration benchmark
        if: github.ref == 'refs/heads/improve/engine-modernization' || (github.event_name == 'workflow_dispatch' && inputs.native_engine)
        timeout-minutes: 15
        run: python tools/benchmark_engine_102.py --exe engine-fixture/colmap-cpu/bin/colmap.exe
      - name: Upload engine benchmark evidence
        if: always() && (github.ref == 'refs/heads/improve/engine-modernization' || (github.event_name == 'workflow_dispatch' && inputs.native_engine))
        uses: actions/upload-artifact@v4
        with:
          name: engine-benchmark-windows
          path: engine-benchmark.json
          if-no-files-found: ignore
