name: Exact runtime native dependency review
on:
  push:
    branches: ["release/lens2mesh-1.0.5-candidate"]
    paths: ["tools/review_native_dependencies.py", ".github/workflows/dependency-review-105.yml"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Read disposable published runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pefile
          if ($LASTEXITCODE) { throw 'PE reader setup failed' }
          gh release download v1.0.4 --repo behdad-nayyerpour/Desktop-PhotoMesh-Studio --pattern PhotoMeshStudio_Setup_1.0.4.exe --dir released
          if ($LASTEXITCODE) { throw 'Baseline download failed' }
          $setup=(Get-Item released/PhotoMeshStudio_Setup_1.0.4.exe).FullName
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -ne '059c81c30479f6c839fcb643f7527a73af94232505aac33840804834fce25b3f') { throw 'Baseline hash mismatch' }
          $root=Join-Path $env:RUNNER_TEMP 'native-review'
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$root+'"'),'/TASKS=""') -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode) { throw 'Disposable installation failed' }
          python tools/review_native_dependencies.py --root $root --output native-review
          if ($LASTEXITCODE) { throw 'Native review failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Native-dependency-review
          path: native-review/
          retention-days: 30
