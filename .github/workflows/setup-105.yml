name: Build, verify and publish Lens2Mesh 1.0.5
on:
  push:
    branches: ["release/lens2mesh-1.0.5-candidate"]
    paths: [".github/workflows/setup-105.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: setup-105-candidate
  cancel-in-progress: false
jobs:
  setup:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the exact disposable 1.0.4 upgrade baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.0.4 --repo behdad-nayyerpour/Lens2Mesh --pattern PhotoMeshStudio_Setup_1.0.4.exe --dir released
          if ($LASTEXITCODE) { throw 'Baseline acquisition failed' }
          $baseline=(Get-Item released/PhotoMeshStudio_Setup_1.0.4.exe).FullName
          if ((Get-FileHash -LiteralPath $baseline).Hash.ToLowerInvariant() -ne '059c81c30479f6c839fcb643f7527a73af94232505aac33840804834fce25b3f') { throw 'Baseline identity differs' }
          $root=Join-Path $env:RUNNER_TEMP 'Lens2Mesh 105 upgrade baseline'
          $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$root+'"'),'/TASKS=""')
          $p=Start-Process -FilePath $baseline -ArgumentList $args -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode) { throw 'Baseline installation failed' }
          "SETUP_BASELINE=$root" >> $env:GITHUB_ENV
      - name: Build complete review candidate with production packaging
        shell: pwsh
        run: |
          $compiler="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE) { throw 'Installer compiler preparation failed' }
          }
          & packaging/build_release.ps1 -RuntimeSource $env:SETUP_BASELINE -ISCC $compiler -StageDir (Join-Path $env:RUNNER_TEMP 'Lens2Mesh105Stage') -OutputDir (Join-Path $PWD 'preview') -EngineCache (Join-Path $env:RUNNER_TEMP 'engine-cache')
          if ($LASTEXITCODE) { throw 'Production Setup build failed' }
          @('Lens2Mesh 1.0.5', 'Source: ${{ github.sha }}', 'Native source/build-provenance follow-up is deferred to 1.0.6 by the user; this is not blanket redistribution clearance.') | Set-Content preview/BUILD.txt
      - name: Validate upgrade and a fresh custom Unicode destination
        shell: pwsh
        run: |
          $setup=(Get-Item preview/Lens2Mesh_Setup_1.0.5.exe).FullName
          $fixture=Join-Path $env:RUNNER_TEMP 'external survey data'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          $project=Join-Path $fixture 'preserve.pmsx'
          '{"format":"photomesh-studio/2","datasets":[]}' | Set-Content -LiteralPath $project
          $photo=Join-Path $fixture 'original-photo.bin'
          [IO.File]::WriteAllBytes($photo,[byte[]](1,7,3,9,2,8))
          $beforeProject=(Get-FileHash -LiteralPath $project).Hash
          $beforePhoto=(Get-FileHash -LiteralPath $photo).Hash
          $stale=Join-Path $env:SETUP_BASELINE 'app/photomesh/obsolete_setup_probe.py'
          'obsolete' | Set-Content -LiteralPath $stale
          $custom=Join-Path $env:RUNNER_TEMP 'custom install فارسی/Lens2Mesh app'
          foreach ($root in @($env:SETUP_BASELINE,$custom)) {
            $args=@('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$root+'"'),'/TASKS="desktopicon"')
            $p=Start-Process -FilePath $setup -ArgumentList $args -Wait -PassThru -WindowStyle Hidden
            if ($p.ExitCode) { throw 'Setup installation failed' }
            if ($root -eq $env:SETUP_BASELINE -and (Test-Path -LiteralPath $stale)) { throw 'Obsolete managed code survived upgrade' }
            $env:PYTHONPATH=Join-Path $root 'app'
            $python=Join-Path $root 'python/python.exe'
            $kind=if ($root -eq $custom) {'fresh-custom'} else {'upgrade'}
            & $python tools/validate_installed_105.py (Join-Path $root 'app') $PWD (Join-Path $PWD ('preview/'+$kind))
            if ($LASTEXITCODE) { throw 'Installed application identity/UI/manual failed' }
            & $python packaging/verify_runtime_lock.py --root $root
            if ($LASTEXITCODE) { throw 'Installed runtime package versions differ' }
            & $python tools/validate_installed_capacity_105.py packaging/reviewed-qt-removals.json
            if ($LASTEXITCODE) { throw 'Installed native terrain/manual validation failed' }
            & $python tools/validate_installed_ply_105.py
            if ($LASTEXITCODE) { throw 'Installed native PLY validation failed' }
            & $python tools/validate_installed_neural_105.py
            if ($LASTEXITCODE) { throw 'Installed neural runtime validation failed' }
            if ((Get-FileHash -LiteralPath $project).Hash -ne $beforeProject -or (Get-FileHash -LiteralPath $photo).Hash -ne $beforePhoto) { throw 'External project/photo changed' }
          }
          $shell=New-Object -ComObject WScript.Shell
          $shortcutRecords=@()
          foreach ($link in @((Join-Path ([Environment]::GetFolderPath('Desktop')) 'Lens2Mesh.lnk'),(Join-Path ([Environment]::GetFolderPath('Programs')) 'Lens2Mesh.lnk'))) {
            if (-not (Test-Path -LiteralPath $link)) { throw 'Installed shortcut missing' }
            $shortcut=$shell.CreateShortcut($link)
            $nativeJson=& $python tools/read_windows_shortcut_105.py $link
            if ($LASTEXITCODE) { throw 'Unicode shell-link inspection failed' }
            $native=$nativeJson | ConvertFrom-Json
            $shortcutRecords+=[PSCustomObject]@{link=$link;unicode=$native;wsh_target=$shortcut.TargetPath;wsh_icon=$shortcut.IconLocation}
            $shortcutRecords | ConvertTo-Json -Depth 4 | Set-Content preview/shortcut-validation.json
            # Explicit IShellLinkW avoids WSH's demonstrated ANSI conversion.
            # Canonical comparison also handles legitimate DOS 8.3 aliases.
            $targetMatches=& $python -c "import os,sys; print(os.path.normcase(os.path.realpath(sys.argv[1])) == os.path.normcase(os.path.realpath(sys.argv[2])))" $native.target (Join-Path $custom 'python/pythonw.exe')
            if ($LASTEXITCODE -or $targetMatches.Trim() -ne 'True') { throw ('Shortcut target differs: '+$native.target) }
            $iconMatches=& $python -c "import os,sys; print(os.path.normcase(os.path.realpath(sys.argv[1])) == os.path.normcase(os.path.realpath(sys.argv[2])))" $native.icon (Join-Path $custom 'app/photomesh/resources/photomesh.ico')
            if ($LASTEXITCODE -or $iconMatches.Trim() -ne 'True') { throw ('Shortcut icon differs: '+$native.icon) }
            $argumentMatches=& $python -c "import os,sys; print(os.path.normcase(os.path.realpath(sys.argv[1].strip(chr(34)))) == os.path.normcase(os.path.realpath(sys.argv[2])))" $native.arguments (Join-Path $custom 'app/main.py')
            if ($LASTEXITCODE -or $argumentMatches.Trim() -ne 'True') { throw 'Shortcut application argument differs' }
          }
          $uninstaller=Join-Path $custom 'unins000.exe'
          $p=Start-Process -FilePath $uninstaller -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode) { throw 'Uninstall failed' }
          if (Test-Path -LiteralPath (Join-Path $custom 'python/python.exe')) { throw 'Managed runtime survived uninstall' }
          if ((Get-FileHash -LiteralPath $project).Hash -ne $beforeProject -or (Get-FileHash -LiteralPath $photo).Hash -ne $beforePhoto) { throw 'External project/photo changed by uninstall' }
          'Upgrade, fresh custom Unicode path, shortcuts, offline native/manual and uninstall checks passed.' | Set-Content preview/installer-validation.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lens2Mesh-1.0.5-Setup-Candidate
          path: preview/
          retention-days: 30
  publish:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require exact-source regression and installed-candidate checks
        run: |
          python - <<'PY'
          import json, os, time, urllib.request
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/actions/runs?head_sha=${{ github.sha }}&per_page=100'
          for _ in range(120):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response: runs=json.load(response)['workflow_runs']
              required=['Tests','Lens2Mesh incremental candidate and runtime inventory']
              selected=[next((r for r in runs if r['name']==name),None) for name in required]
              if all(r and r['status']=='completed' for r in selected):
                  assert all(r['conclusion']=='success' for r in selected), [(r['name'],r['conclusion']) for r in selected]
                  print('Exact-source checks passed:',[(r['name'],r['id']) for r in selected]); break
              time.sleep(15)
          else: raise RuntimeError('Exact-source validation did not complete')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: Lens2Mesh-1.0.5-Setup-Candidate
          path: candidate
      - name: Verify and publish the validated installer
        run: |
          test -f candidate/installer-validation.txt
          (cd candidate && sha256sum -c Lens2Mesh_Setup_1.0.5.exe.sha256)
          cp photomesh/resources/manual/Lens2Mesh_1.0.5_Complete_User_Manual.pdf candidate/
          gh release create v1.0.5 --draft --title 'Lens2Mesh 1.0.5' --target '${{ github.sha }}' --notes-file docs/releases/1.0.5.md
          gh release upload v1.0.5 candidate/Lens2Mesh_Setup_1.0.5.exe candidate/Lens2Mesh_Setup_1.0.5.exe.sha256 candidate/Lens2Mesh_1.0.5_Complete_User_Manual.pdf
          gh release download v1.0.5 --pattern 'Lens2Mesh_Setup_1.0.5.exe*' --dir verified
          (cd verified && sha256sum -c Lens2Mesh_Setup_1.0.5.exe.sha256)
          cmp candidate/Lens2Mesh_Setup_1.0.5.exe verified/Lens2Mesh_Setup_1.0.5.exe
          git push origin HEAD:main
          gh release edit v1.0.5 --draft=false --latest
          gh release view v1.0.5 --json url,assets,publishedAt > candidate/publication.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lens2Mesh-1.0.5-Publication-Evidence
          path: |
            candidate/publication.json
            candidate/installer-validation.txt
            candidate/*.sha256
