name: Actual public survey UI screenshots
on:
  push:
    branches: ["release/lens2mesh-1.0.5-candidate"]
    paths: ["tools/capture_public_ui_105.py", ".github/workflows/public-ui-105.yml"]
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43395630399
          name: Public-survey-validation
          path: surveyed-evidence
      - name: Prepare real Mesa OpenGL display
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libgomp1 xvfb xauth libgl1-mesa-dri libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-randr0
      - run: pip install -q -r requirements-dev.txt
      - name: Capture actual Dark and Light UI
        env:
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a -s '-screen 0 2000x1300x24' python tools/capture_public_ui_105.py --evidence surveyed-evidence --output public-ui
      - uses: actions/upload-artifact@v4
        with:
          name: Actual-Lens2Mesh-105-screenshots
          path: |
            public-ui/*.png
            public-ui/screenshot-provenance.json
          retention-days: 30
