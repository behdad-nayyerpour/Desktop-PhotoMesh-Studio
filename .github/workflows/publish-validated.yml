name: Publish validated PhotoMesh release
on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-validated.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: publish-photomesh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify validated source and artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git show HEAD:photomesh/__init__.py | grep APP_VERSION | head -1)" = "$(git show 127c682c6d05d61093843f5a1ed8a23f833005d8:photomesh/__init__.py | grep APP_VERSION | head -1)"
          git diff --exit-code 127c682c6d05d61093843f5a1ed8a23f833005d8 HEAD -- photomesh main.py requirements.txt requirements-dev.txt packaging/build_release.ps1 packaging/release.iss packaging/engine-assets.json packaging/fix_shortcut_icon.ps1 run.bat setup.bat
          test "$(gh api repos/$GH_REPO/actions/runs/42310283579 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42310283579 --jq .head_sha)" = 127c682c6d05d61093843f5a1ed8a23f833005d8
          test "$(gh api repos/$GH_REPO/actions/artifacts/13547844488 --jq .expired)" = false
          test "$(gh api repos/$GH_REPO/actions/artifacts/13547844488 --jq .workflow_run.head_sha)" = 127c682c6d05d61093843f5a1ed8a23f833005d8
          gh api repos/$GH_REPO/actions/artifacts/13547844488/zip > candidate.zip
          echo "7838e70fc937ab57c1d2e4d47987f3e3f984fa7afe866406e447cfd4248ac31b  candidate.zip" | sha256sum -c -
          unzip -q candidate.zip -d candidate
          test -f candidate/PhotoMeshStudio_Setup_1.0.3.exe
          test -f candidate/PhotoMeshStudio_Setup_1.0.3.exe.sha256
          cd candidate
          sha256sum -c PhotoMeshStudio_Setup_1.0.3.exe.sha256
      - name: Upload verified Setup and publish 1.0.3
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          PhotoMesh Studio 1.0.3
          
          - Clearer menus, independent icons and complete layer-control captions.
          - Safer project saving, cleanup and failed-rebuild recovery.
          - Consistent EXIF altitude handling and memory-budget checks.
          
          Compatibility: new saves use project schema 2; reference XML exports use PhotoMesh XML 2.0. Keep a project copy for older versions.
          
          Validation: 680 tests passed on each of Windows and Linux; native CPU reconstruction, installer upgrade and installed-user appearance review passed. Real-data CUDA reconstruction remains hardware-dependent.
          
          Includes the full offline Windows Setup and SHA-256 checksum.
          NOTES
          if gh release view v1.0.3 >/dev/null 2>&1; then
            test "$(gh release view v1.0.3 --json isDraft --jq .isDraft)" = true
            gh release upload v1.0.3 candidate/PhotoMeshStudio_Setup_1.0.3.exe candidate/PhotoMeshStudio_Setup_1.0.3.exe.sha256 --clobber
            gh release edit v1.0.3 --notes-file release-notes.md --target "$GITHUB_SHA"
          else
            gh release create v1.0.3 candidate/PhotoMeshStudio_Setup_1.0.3.exe candidate/PhotoMeshStudio_Setup_1.0.3.exe.sha256 --draft --title "PhotoMesh Studio 1.0.3" --target "$GITHUB_SHA" --notes-file release-notes.md
          fi
          test "$(gh release view v1.0.3 --json assets --jq '.assets | length')" = 2
          gh release edit v1.0.3 --draft=false --latest
          gh release view v1.0.3 --json url,isDraft,isPrerelease,assets
