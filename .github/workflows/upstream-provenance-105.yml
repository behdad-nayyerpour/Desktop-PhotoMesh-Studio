name: Exact upstream wheel and native provenance
on:
  push:
    branches: ["release/lens2mesh-1.0.5-candidate"]
    paths: ["tools/review_upstream_provenance.py", ".github/workflows/upstream-provenance-105.yml"]
permissions:
  contents: read
jobs:
  review:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Inspect disposable published runtime against primary upstream
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install pefile packaging
          if ($LASTEXITCODE) { throw 'Review tool preparation failed' }
          gh release download v1.0.4 --repo behdad-nayyerpour/Desktop-PhotoMesh-Studio --pattern PhotoMeshStudio_Setup_1.0.4.exe --dir released
          if ($LASTEXITCODE) { throw 'Baseline download failed' }
          $setup=(Get-Item released/PhotoMeshStudio_Setup_1.0.4.exe).FullName
          if ((Get-FileHash -LiteralPath $setup).Hash.ToLowerInvariant() -ne '059c81c30479f6c839fcb643f7527a73af94232505aac33840804834fce25b3f') { throw 'Baseline hash mismatch' }
          $root=Join-Path $env:RUNNER_TEMP 'upstream-review'
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="'+$root+'"'),'/TASKS=""') -Wait -PassThru -WindowStyle Hidden
          if ($p.ExitCode) { throw 'Disposable installation failed' }
          python tools/review_upstream_provenance.py --root $root --output upstream-review
          if ($LASTEXITCODE) { throw 'Primary provenance review failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Exact-upstream-provenance
          path: upstream-review/
          retention-days: 30
